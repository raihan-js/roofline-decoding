name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test-cpu:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]" && pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pytest tests/ -v  # GPU tests self-skip without CUDA
